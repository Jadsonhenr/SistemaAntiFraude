services:
  web:
    build: .
    command: sh -c "flask --app run.py db upgrade && gunicorn --workers 2 --threads 4 --timeout 120 --bind 0.0.0.0:5000 run:app"
    env_file: .env
    ports: ["5000:5000"]
    volumes: ["./storage:/app/storage"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  worker:
    build: .
    command: celery -A app.tasks.celery_app.celery worker --loglevel=INFO
    env_file: .env
    volumes: ["./storage:/app/storage"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: antifraude
      POSTGRES_USER: antifraude
      POSTGRES_PASSWORD: antifraude
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antifraude -d antifraude"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
