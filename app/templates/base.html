<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Antifraude DT{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head>
<body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/">Antifraude DT</a>
<div class="d-flex gap-3 align-items-center">{% if current_user.is_authenticated %}
<a class="text-white" href="{{ url_for('turmas.index') }}">Turmas</a><span class="text-white">{{ current_user.nome }}</span>
<form method="post" action="{{ url_for('auth.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-light">Sair</button></form>
{% else %}<a class="text-white" href="{{ url_for('auth.login') }}">Entrar</a>{% endif %}</div></div></nav>
<main class="container py-4">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}
<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</body></html>
