{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-4"><h1>Turmas</h1><a class="btn btn-primary" href="{{ url_for('turmas.nova') }}">Criar turma</a></div>
{% for t in turmas %}<div class="card mb-2"><div class="card-body"><h2 class="h5">{{ t.nome }}</h2><p>{{ t.disciplina }}</p><a href="{{ url_for('analises.nova',turma_id=t.id) }}">Criar análise</a>{% for a in t.analises %}<span class="ms-3"><a href="{{ url_for('analises.detalhe',analysis_id=a.id) }}">{{ a.nome }}</a></span>{% endfor %}</div></div>{% else %}<p>Você ainda não cadastrou turmas.</p>{% endfor %}{% endblock %}
