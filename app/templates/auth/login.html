{% extends 'base.html' %}{% block title %}Entrar{% endblock %}{% block content %}
<div class="auth-card"><h1 class="h3 mb-4">Acesso do professor</h1><form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">E-mail</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Senha</label><input class="form-control mb-3" type="password" name="senha" required>
<button class="btn btn-primary w-100">Entrar</button></form><p class="mt-3 mb-0">Não possui conta? <a href="{{ url_for('auth.register') }}">Cadastre-se</a></p></div>{% endblock %}
