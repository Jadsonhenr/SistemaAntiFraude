{% extends 'base.html' %}{% block title %}Cadastro{% endblock %}{% block content %}
<div class="auth-card"><h1 class="h3 mb-4">Criar conta de professor</h1><form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Nome</label><input class="form-control mb-3" name="nome" required>
<label class="form-label">E-mail</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Senha (mínimo 10 caracteres)</label><input class="form-control mb-3" type="password" name="senha" minlength="10" required>
<button class="btn btn-primary w-100">Cadastrar</button></form></div>{% endblock %}
